<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
      background: var(--tg-theme-bg-color, #fff);
      color: var(--tg-theme-text-color, #000);
    }
    button {
      width: 80%;
      margin: 8px;
      padding: 14px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #fff);
    }
    #count { font-size: 64px; margin: 20px 0; }
  </style>
</head>
<body>
  <h2 id="hello">Привет!</h2>
  <p>Это мини-приложение внутри Telegram</p>
  <div id="count">0</div>
  <button onclick="add()">Нажми меня 👆</button>
  <button onclick="send()">Отправить результат боту</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const user = tg.initDataUnsafe.user;
    if (user) {
      document.getElementById("hello").innerText = "Привет, " + user.first_name + "!";
    }

    let count = 0;
    function add() {
      count++;
      document.getElementById("count").innerText = count;
      tg.HapticFeedback.impactOccurred("light");
    }

    function send() {
      tg.sendData(String(count));
    }
  </script>
</body>
</html>
